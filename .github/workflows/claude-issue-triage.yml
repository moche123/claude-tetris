name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label create:*),Bash(gh label list:*)"'
          prompt: |
            Analyze issue #${{ github.event.issue.number }} from this Tetris repo
            (title: "${{ github.event.issue.title }}").

            1. Read CLAUDE.md to understand the architecture (board model, pieces,
               rotation, collision, game loop, locking/clearing, scoring, rendering,
               input) and read game.js/index.html/style.css as needed to locate the
               function or section related to the described problem.

            2. Assign labels with `gh issue edit ${{ github.event.issue.number }} --add-label "..."`:
               - One type label: bug, enhancement, question, duplicate, invalid,
                 documentation, help wanted, or good first issue (use the ones that
                 already exist in the repo).
               - One or more area labels for the affected subsystem: rendering,
                 input, collision, game-loop, scoring, state, rotation. If the area
                 label doesn't exist yet, create it first with
                 `gh label create <name> --color <hex> --description "..."`.

            3. Post ONE new comment (`gh issue comment ${{ github.event.issue.number }} --body "..."`)
               with a technical diagnosis in English. Body must be valid GitHub-flavored
               Markdown (headers/bold/code-fences render correctly on GitHub), formatted as:
               - **Diagnosis**: likely root cause in 1-2 sentences.
               - **Affected code**: specific file(s) and function(s)/section(s)
                 (e.g. `tryRotate()` in game.js, `collide()`, `clearLines()`, etc).
               - **Suggested approach**: high-level idea for the fix, without writing
                 the code yet (that gets implemented later, in another task).

            Do not modify the issue title or body. Do not write code or make
            commits. If the issue doesn't give enough info to diagnose, say so
            explicitly in the comment and ask for the missing details.
